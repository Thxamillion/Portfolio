name: Sync Portfolio Data

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:      # Manual trigger
  push:
    paths:
      - 'data/portfolio.json'

env:
  AWS_REGION: us-east-1

# Required for OIDC
permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload portfolio.json to S3
        run: |
          aws s3 cp data/portfolio.json s3://quin-portfolio-data-dev/portfolio.json

      - name: Fetch and Upload READMEs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-readmes.js

      - name: Upload READMEs to S3
        run: |
          if [ -d "data/readmes" ]; then
            aws s3 sync data/readmes/ s3://quin-portfolio-data-dev/readmes/
          fi
