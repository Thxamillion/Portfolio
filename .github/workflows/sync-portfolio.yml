name: Sync Portfolio Data

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:      # Manual trigger
  push:
    paths:
      - 'data/portfolio.json'

env:
  AWS_REGION: us-east-1

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Get S3 Bucket Name
        working-directory: terraform
        run: |
          terraform init
          echo "BUCKET=$(terraform output -raw portfolio_data_bucket_name)" >> $GITHUB_ENV
        env:
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_posthog_api_key: ${{ secrets.POSTHOG_API_KEY }}

      - name: Upload portfolio.json to S3
        run: |
          aws s3 cp data/portfolio.json s3://${{ env.BUCKET }}/portfolio.json

      - name: Fetch and Upload READMEs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-readmes.js

      - name: Upload READMEs to S3
        run: |
          if [ -d "data/readmes" ]; then
            aws s3 sync data/readmes/ s3://${{ env.BUCKET }}/readmes/
          fi
